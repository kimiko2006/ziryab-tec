<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Ziryab Tec</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <nav class="navbar">

            <div class="logo">
                <span class="logo-icon">ZT</span>
                <span>Ziryab Tec</span>
            </div>

            <ul class="nav-menu">

                <li>
                    <a href="../index.html">
                        Accueil
                    </a>
                </li>

                <li>
                    <a href="formations.html">
                        Formations
                    </a>
                </li>

                <li>
                    <a href="formateurs.html">
                        Formateurs
                    </a>
                </li>

                <li>
                    <a href="apropos.html">
                        À propos
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- PAGE CONNEXION -->

    <main>

        <div class="form-container">

            <h1 style="text-align:center; margin-bottom:2rem;">
                Connexion
            </h1>


            <!-- MESSAGE D'ERREUR -->

            <div
                id="loginMessage"
                class="alert alert-error"
                style="display:none;"
            ></div>


            <!-- FORMULAIRE -->

            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="exemple@email.com"
                        required
                    >

                </div>


                <!-- MOT DE PASSE -->

                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Votre mot de passe"
                        required
                    >

                </div>


                <!-- BOUTON -->

                <button
                    type="submit"
                    class="btn btn-primary"
                    style="width:100%;"
                >
                    Se connecter
                </button>

            </form>


            <!-- INSCRIPTION -->

            <p style="
                text-align:center;
                margin-top:1.5rem;
            ">

                Vous n'avez pas encore de compte ?

                <a
                    href="inscription.html"
                    style="color:#4a90e2;"
                >
                    Créer un compte
                </a>

            </p>


            <!-- RETOUR -->

            <p style="
                text-align:center;
                margin-top:1rem;
            ">

                <a href="../index.html">
                    ← Retour à l'accueil
                </a>

            </p>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
